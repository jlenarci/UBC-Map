<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>We can make the paint properties depend on whether we are highlighting</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />
<style>
    #legend {
        width: 220px;
        padding: 8px;
        background: white;
        font-family: Arial, sans-serif;
    }

    .legend-dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
    }
</style>
</head>
<body>
<div id="mapid" style="width: 100%; height: 75vh;"></div>
    <div id="controls" style="margin: 15px;">
      <button id="showAllAddressesButton">Show All Addresses</button>

      <span style="display: inline-block; width: 30px;"></span>
      <input type="text" id="highlightAddressesTextEntry" placeholder="e.g. Main">
      <button id="highlightAddressesButton">Highlight</button>
    </div>

<div id="legend">
    <strong>UBC Address Types</strong>
    <p>
        <span class="legend-dot" style="background: #1b7837;"></span>
        Residential
    </p>
    <p>
        <span class="legend-dot" style="background: #888888;"></span>
        Non-Residential
    </p>
    <p>Data: From UBC OpenGeodata</p>
    </div>
 <script type="module">
 import * as maplibregl
 from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';
 const map = new maplibregl.Map({
 container: 'mapid', // the id of the div above
 center: [-123.256113, 49.265637], // [longitude, latitude]
 zoom: 15,
 style: 'https://tiles.openfreemap.org/styles/positron'
});
window.map = map; // so that the console can find map
const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/885732d332a20a59143f655c83fb15e1367ebe4d/ubcv/locations/geojson/ubcv_address.geojson';
 const addressMarkerPaint = {
    'circle-radius': 6,
    'circle-color': [
        'match',
        ['get', 'ADDRESS_DESCRIPTOR'],
        'Residential', '#1b7837',
        '0', '#762a83',
        '#888888'
    ],
    'circle-opacity': 0.6
};

function onEachAddress(e) {
    const address = e.features[0].properties;

    if (address.FULL_ADDRESS) {
        const popup = new maplibregl.Popup();
        popup.setLngLat(e.lngLat);
        popup.setText(address.FULL_ADDRESS);
        popup.addTo(map);
    }
}
        function showAllAddresses() {
            addAddresses();
            map.setFilter('adresses-circles', null);

            map.setPaintProperty('adresses-circles', 'circle-color',
                addressMarkerPaint['circle-color']
            );

            map.setPaintProperty( 'adresses-circles','circle-opacity',
                addressMarkerPaint['circle-opacity']
            );
        }

        function highlightAddresses() {
            addAddresses();
            const textEntry = document.getElementById('highlightAddressesTextEntry');
            const addressToHighlight = textEntry.value;
            if (addressToHighlight === '') {
                showAllAddresses();
                return;
            }
            map.setFilter('adresses-circles',[ 'in', addressToHighlight,
                    ['to-string', 'FULL_ADDRESS']
                ]
            );

            map.setPaintProperty('adresses-circles', 'circle-color','#ff7f00'
            );

            map.setPaintProperty( 'adresses-circles','circle-opacity', 0.9);
        }

        function addAddresses() {

    if (map.getSource('adresses')) {
        return;
    }

    map.addSource('adresses', {
        type: 'geojson',
        data: url,
        attribution: 'Addresses: UBCGeodata'
    });

    map.addLayer({
        id: 'adresses-circles',
        type: 'circle',
        source: 'adresses',
        paint: addressMarkerPaint
    });

    map.on('click', 'adresses-circles', onEachAddress);
}

       map.on('load', function () { addAddresses();
       const showAllButton = 
    document.getElementById('showAllAddressesButton');
       showAllButton.addEventListener('click', showAllAddresses);
       const highlightButton = document.getElementById('highlightAddressesButton');
        highlightButton.addEventListener('click', 
    highlightAddresses);
});

    </script>
</body>
</html>
